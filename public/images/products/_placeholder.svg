<?xml version="1.0" encoding="UTF-8"?>
<!--
  Generic product card placeholder (per ADR-013).
  Used when a per-product photo has not been delivered yet.
  Card layout (VB1) never changes; only this image swaps to the per-product .webp when delivered.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 1200"
  width="1600"
  height="1200"
  preserveAspectRatio="xMidYMid slice"
  role="img"
  aria-label="Product image — placeholder"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062B49" />
      <stop offset="100%" stop-color="#04233D" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)" />

  <!-- Three-panel symbol — centered, low-prominence -->
  <g transform="translate(680 480)" opacity="0.35">
    <rect x="0" y="0" width="80" height="240" rx="3" fill="#B8C7D6" />
    <rect x="40" y="12" width="80" height="240" rx="3" fill="#5F7894" />
    <rect x="80" y="24" width="80" height="240" rx="3" fill="#062B49" stroke="#5F7894" stroke-width="0.5" />
  </g>

  <!-- Subtle bottom label area -->
  <rect x="0" y="1100" width="1600" height="100" fill="#04233D" opacity="0.5" />
</svg>
