<?xml version="1.0" encoding="UTF-8"?>
<!--
  JARA International — default Open Graph card placeholder (Sprint 1).
  Used by social/link previews until user delivers final og-default.png.
  Replace this file by dropping og-default.png into this folder and
  removing the .svg extension fallback (Sprint 2 polish).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  width="1200"
  height="630"
  role="img"
  aria-label="JARA International Inc. — Global Sourcing. Built on Trust."
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062B49" />
      <stop offset="100%" stop-color="#04233D" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Three-panel symbol — left -->
  <g transform="translate(100 240)">
    <rect x="0" y="0" width="50" height="150" rx="3" fill="#B8C7D6" />
    <rect x="25" y="8" width="50" height="150" rx="3" fill="#5F7894" />
    <rect x="50" y="16" width="50" height="150" rx="3" fill="#FFFFFF" />
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#FFFFFF">
    <text x="280" y="295" font-size="68" font-weight="800" letter-spacing="2">JARA</text>
    <text x="280" y="345" font-size="28" font-weight="600" letter-spacing="3" fill="#B8C7D6">INTERNATIONAL INC.</text>
    <text x="280" y="420" font-size="24" font-weight="400" fill="#5F7894">Global Sourcing. Built on Trust.</text>
  </g>

  <!-- URL bottom right -->
  <text
    x="1100"
    y="595"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#5F7894"
    text-anchor="end"
  >
    jarainternational.com
  </text>
</svg>
