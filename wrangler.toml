#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers config for OpenNext deploy (per Round 4 J2 lock).
# Generated by Phase 4 Sprint 1.

name = "jara-international"
main = ".open-next/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (per OpenNext convention)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Custom domain — bind after first deploy via Cloudflare dashboard or `wrangler deploy`
# routes = [
#   { pattern = "jarainternational.com", custom_domain = true },
#   { pattern = "www.jarainternational.com", custom_domain = true }
# ]

# Observability — enable Cloudflare Web Analytics + Workers logs (per ADR Phase 2 finding)
[observability]
enabled = true

# R2 incremental cache binding (Round 12 R12-U3 4/4 unanimous).
# The bucket itself must exist in the Cloudflare account before the first
# deploy after this change. Suggested bucket name:
# jara-international-next-cache. The binding name `NEXT_INC_CACHE_R2_BUCKET`
# is the convention expected by OpenNext's r2IncrementalCache override
# (see open-next.config.ts).
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "jara-international-next-cache"

# Smart Placement (Cloudflare auto-routes Worker close to data sources for lower latency)
# [placement]
# mode = "smart"

# Worker env vars.
#
# The Turnstile SITE key is a public credential intended to be exposed in
# client JS (Cloudflare's own docs publish it in HTML examples). Putting
# it here guarantees it's available at runtime via env.* on the Worker
# regardless of dashboard configuration. The PRIVATE secret key still
# lives in dashboard Variables and Secrets as type: Secret.
#
# All other secrets (TURNSTILE_SECRET_KEY, N8N webhook URLs/secret) MUST
# stay in the Cloudflare dashboard, never here.
[vars]
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADOAZm2iZ8nLhEFq"
